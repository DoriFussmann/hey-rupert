<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS — Team</title>
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body data-page="team">
    <div class="cms-shell">
      <aside class="cms-nav" aria-label="CMS">
        <p class="cms-nav-brand">Rupert CMS</p>
        <nav>
          <a href="/#articles" data-nav="articles">Articles</a>
          <a href="/#add" data-nav="add">Add Article</a>
          <a href="/articles-health.html" data-nav="health">Articles Health</a>
          <a href="/articles-update.html" data-nav="update">Articles Update</a>
          <a href="/team.html" data-nav="team" class="is-active">Team</a>
          <a href="/dashboard.html" data-nav="dashboard">Dashboard</a>
        </nav>
      </aside>
      <main class="cms-main">
        <h1>Team</h1>
        <p id="status" role="status"></p>
        <section>
          <h2>Existing team</h2>
          <ul id="team-list"></ul>
        </section>
        <form id="team-form">
          <p>
            <label>name <input id="team-name" name="name" required /></label>
          </p>
          <p>
            <label>slug <input id="team-slug" name="slug" required /></label>
          </p>
          <p>
            <label>role <input id="team-role" name="role" required /></label>
          </p>
          <p>
            <label>bio <textarea id="team-bio" name="bio" required></textarea></label>
          </p>
          <p>
            <label>credentials <input id="team-credentials" name="credentials" /></label>
          </p>
          <p>
            <label>photo <input id="team-photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" /></label>
          </p>
          <p>Maximum 10MB per file.</p>
          <p>
            <label>sameAs (one URL per line)
              <textarea id="team-sameas" name="sameAs"></textarea>
            </label>
          </p>
          <p>
            <button type="submit">Save team member</button>
          </p>
        </form>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
