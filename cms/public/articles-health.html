<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS — Articles Health</title>
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body data-page="articles-health">
    <div class="cms-shell">
      <aside class="cms-nav" aria-label="CMS">
        <p class="cms-nav-brand">Rupert CMS</p>
        <nav>
          <a href="/#articles" data-nav="articles">Articles</a>
          <a href="/#add" data-nav="add">Add Article</a>
          <a href="/articles-health.html" data-nav="health" class="is-active">Articles Health</a>
          <a href="/articles-update.html" data-nav="update">Articles Update</a>
          <a href="/team.html" data-nav="team">Team</a>
          <a href="/dashboard.html" data-nav="dashboard">Dashboard</a>
        </nav>
      </aside>
      <main class="cms-main">
        <h1>Articles Health</h1>
        <p id="status" role="status"></p>
        <p id="session-banner" class="health-banner" hidden></p>

        <p class="health-toolbar">
          <button type="button" id="connect-all-internal">Connect All Internal Links</button>
          <button type="button" id="scan-add-external">Find, Approve and Connect All External Links</button>
          <button type="button" id="scan-all-diagnostics">Scan All Diagnostics</button>
        </p>
        <div class="health-progress-row">
          <div id="external-scan-spinner" class="cms-spinner" hidden></div>
          <p id="batch-progress" role="status"></p>
          <button type="button" id="external-scan-cancel" hidden>Cancel</button>
        </div>

        <section id="external-review" class="external-review" hidden>
          <h2 id="external-scan-title">Review external link candidates</h2>
          <p id="external-scan-status"></p>
          <div id="external-scan-summary" class="external-summary"></div>
          <p class="external-review__actions">
            <button type="button" id="external-scan-approve" disabled>
              Approve &amp; Connect All External Links
            </button>
            <button type="button" id="external-review-cancel">Cancel</button>
          </p>
        </section>

        <ul id="health-list" class="health-list"></ul>
      </main>
    </div>
    <script src="/articles-health.js"></script>
  </body>
</html>
